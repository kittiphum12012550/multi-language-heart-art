<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Heart</title>
    <style>
        body {
            background-color: #050505; /* พื้นหลังสีดำ */
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }
        #heart-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        .text-word {
            position: absolute;
            color: #ff3333; /* สีแดง */
            text-shadow: 0 0 4px #ff0000; /* เรืองแสงนิดๆ แบบในรูป */
            opacity: 0;
            animation: fadeIn 1.5s forwards;
            white-space: nowrap;
            pointer-events: none;
        }
        /* แอนิเมชันให้ค่อยๆ สว่างขึ้นมา */
        @keyframes fadeIn {
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="heart-container"></div>

    <script>
        // ชุดคำบอกรักภาษาต่างๆ แบบเดียวกับในภาพ
        const phrases = [
            "Ich liebe dich", "Ti amo", "愛してる", "Aku cinta kamu",
            "ฉันรักเธอ", "Te amo", "Je t'aime", "사랑해",
            "Jag älskar dig", "Я тебя люблю", "Σ' αγαπώ", "Anh yêu em",
            "Ik hou van jou", "I love you", "Seni seviyorum", "Kocham cię",
            "मैं तुमसे प्यार करता हूँ"
        ];

        const container = document.getElementById('heart-container');
        let centerX = window.innerWidth / 2;
        let centerY = window.innerHeight / 2;
        
        // ปรับขนาดความกว้าง-สูงของรูปหัวใจ
        const scale = 220; 
        const totalTexts = 350; // จำนวนตัวหนังสือที่จะให้ถมจนเต็ม

        function random(min, max) {
            return Math.random() * (max - min) + min;
        }

        // อัปเดตจุดศูนย์กลางหากมีการย่อขยายหน้าจอ
        window.addEventListener('resize', () => {
            centerX = window.innerWidth / 2;
            centerY = window.innerHeight / 2;
        });

        // วนลูปสร้างตัวหนังสือ
        for (let i = 0; i < totalTexts; i++) {
            // ใช้ setTimeout เพื่อหน่วงเวลาให้ "ค่อยๆ เต็มเป็นรูปหัวใจ" ทีละคำ
            setTimeout(() => {
                let x, y;
                // ใช้สมการคณิตศาสตร์เพื่อเช็คพื้นที่ด้านในของรูปหัวใจ (Heart Equation)
                while (true) {
                    x = random(-1.5, 1.5);
                    let mathY = random(-1.5, 1.5);
                    // สมการหัวใจ (x^2 + y^2 - 1)^3 - x^2 * y^3 <= 0
                    if (Math.pow(x*x + mathY*mathY - 1, 3) - (x*x * Math.pow(mathY, 3)) <= 0) {
                        y = -mathY; // กลับแกน Y สำหรับการแสดงผลบนหน้าจอคอมพิวเตอร์
                        break;
                    }
                }

                const textEl = document.createElement('div');
                textEl.className = 'text-word';
                textEl.innerText = phrases[Math.floor(Math.random() * phrases.length)];
                
                // คำนวณตำแหน่งพิกัด X, Y บนหน้าจอ
                textEl.style.left = `${centerX + (x * scale)}px`;
                textEl.style.top = `${centerY + (y * scale)}px`;
                
                // สุ่มขนาดฟอนต์ให้ดูมีมิติ
                textEl.style.fontSize = `${random(10, 16)}px`;
                textEl.style.transform = 'translate(-50%, -50%)';

                container.appendChild(textEl);
            }, i * 30); // ระยะเวลาหน่วงแต่ละคำ (30 มิลลิวินาที)
        }
    </script>
</body>
</html>
