<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beautiful Flying Love Heart</title>
    <!-- นำเข้าฟอนต์ Google Fonts ให้ดูโค้งมนและโรแมนติกขึ้น -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&family=Quicksand:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            /* พื้นหลังไล่สีจากแดงเข้มมืดๆ ตรงกลาง ไปหาดำสนิทที่ขอบจอ */
            background: radial-gradient(circle at center, #1a0005 0%, #000000 100%);
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #heart-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        .text-word {
            position: absolute;
            opacity: 0;
            white-space: nowrap;
            pointer-events: none;
            font-family: 'Nunito', sans-serif;
            /* จุดเริ่มต้น: ขยายใหญ่ 4 เท่าและเบลอ */
            transform: translate(-50%, -50%) scale(4);
            filter: blur(8px);
            /* แอนิเมชันตอนบินเข้ามา (นุ่มนวลและดูมีมิติ) */
            transition: transform 2.2s cubic-bezier(0.25, 1, 0.3, 1), 
                        opacity 1.5s ease-out,
                        filter 2s ease-out;
        }
        
        /* คลาสที่จะถูกเพิ่มเข้าไปเมื่อคำบินมาถึงที่แล้ว เพื่อให้เรืองแสงกระเพื่อม */
        .text-word.settled {
            animation: pulseGlow 2.5s infinite alternate ease-in-out;
        }

        /* เอฟเฟกต์แสงหายใจ */
        @keyframes pulseGlow {
            0% { 
                text-shadow: 0 0 4px currentColor; 
                filter: brightness(0.9); 
            }
            100% { 
                text-shadow: 0 0 10px currentColor, 0 0 25px currentColor; 
                filter: brightness(1.3); 
                transform: translate(-50%, -50%) scale(1.03); /* ขยายขนาดนิดๆ ตอนสว่างสุด */
            }
        }
    </style>
</head>
<body>
    <div id="heart-container"></div>

    <script>
        const phrases = [
            "Ich liebe dich", "Ti amo", "愛してる", "Aku cinta kamu",
            "ฉันรักเธอ", "Te amo", "Je t'aime", "사랑해",
            "Jag älskar dig", "Я тебя люблю", "Σ' αγαπώ", "Anh yêu em",
            "Ik hou van jou", "I love you", "Seni seviyorum", "Kocham cię",
            "รักเธอ", "คิดถึงเธอ", "My Love", "Always"
        ];

        // ชุดโทนสีโรแมนติกที่ทำให้ดูแพงขึ้น
        const colors = [
            '#ff2a55', // แดงอมชมพูสด
            '#ff003c', // แดงเข้ม
            '#ff6680', // ชมพูพาสเทล
            '#ff99aa', // ชมพูสว่าง
            '#ff0011', // แดงนีออน
            '#ffd9e0'  // ขาวอมชมพู
        ];

        const container = document.getElementById('heart-container');
        let centerX = window.innerWidth / 2;
        let centerY = window.innerHeight / 2;
        
        const scale = 230; 
        const maxWords = 320; 

        const placedWords = [];

        // เว้นระยะห่างให้ชิดขึ้นเล็กน้อย เพื่อให้หัวใจดูแน่นสวยงาม
        function isOverlapping(x, y, width, height) {
            const paddingX = 6; 
            const paddingY = 4;  

            for (let word of placedWords) {
                if (
                    x < word.x + word.width + paddingX &&
                    x + width + paddingX > word.x &&
                    y < word.y + word.height + paddingY &&
                    y + height + paddingY > word.y
                ) {
                    return true;
                }
            }
            return false;
        }

        function getHeartTargetPosition(text, fontSize) {
            const fontStyle = '600 ' + fontSize + " 'Nunito', sans-serif";
            const span = document.createElement('span');
            span.style.font = fontStyle;
            span.style.visibility = 'hidden';
            span.style.position = 'absolute';
            span.innerText = text;
            document.body.appendChild(span);
            
            const width = span.offsetWidth;
            const height = span.offsetHeight;
            document.body.removeChild(span);

            let screenX, screenY;
            let attempts = 0;
            const maxAttempts = 2000; 

            while (attempts < maxAttempts) {
                const targetX = (Math.random() * 3) - 1.5;
                const targetY = (Math.random() * 3) - 1.5;

                if (Math.pow(targetX*targetX + targetY*targetY - 1, 3) - (targetX*targetX * Math.pow(targetY, 3)) <= 0) {
                    screenX = centerX + (targetX * scale);
                    screenY = centerY + (-targetY * scale);

                    if (!isOverlapping(screenX - width/2, screenY - height/2, width, height)) {
                        placedWords.push({
                            x: screenX - width/2,
                            y: screenY - height/2,
                            width: width,
                            height: height
                        });
                        return { x: screenX, y: screenY };
                    }
                }
                attempts++;
            }
            return null; 
        }

        function spawnWord(index) {
            const phrase = phrases[Math.floor(Math.random() * phrases.length)];
            const fontSize = `${Math.floor(Math.random() * 8) + 11}px`; 
            const color = colors[Math.floor(Math.random() * colors.length)];

            const targetPos = getHeartTargetPosition(phrase, fontSize);
            if (!targetPos) return; 

            const textEl = document.createElement('div');
            textEl.className = 'text-word';
            textEl.style.fontSize = fontSize;
            textEl.style.color = color;
            textEl.innerText = phrase;

            // สุ่มเกิดจากทุกทิศทาง (360 องศา) รอบขอบจอ
            const angle = Math.random() * Math.PI * 2;
            const radius = Math.max(window.innerWidth, window.innerHeight) / 1.2;
            const startX = centerX + Math.cos(angle) * radius;
            const startY = centerY + Math.sin(angle) * radius;

            textEl.style.left = `${startX}px`;
            textEl.style.top = `${startY}px`;
            container.appendChild(textEl);

            // หน่วงเวลาเล็กน้อยก่อนสั่งบิน
            setTimeout(() => {
                textEl.style.opacity = '1';
                textEl.style.filter = 'blur(0px)';
                textEl.style.transform = `translate(${targetPos.x - startX}px, ${targetPos.y - startY}px) scale(1)`;
            }, 50); 

            // เมื่อบินไปถึงที่ (ประมาน 2.2 วินาที) ให้เพิ่มคลาส settled เพื่อเริ่มกระเพื่อมเรืองแสง
            setTimeout(() => {
                // อัปเดตตำแหน่งจริง แล้วล้างค่า translate เพื่อให้แอนิเมชัน pulse ทำงานได้สมบูรณ์
                textEl.style.left = `${targetPos.x}px`;
                textEl.style.top = `${targetPos.y}px`;
                textEl.style.transition = 'none'; // ปิด transition เดิม
                textEl.style.transform = 'translate(-50%, -50%) scale(1)';
                
                // สุ่ม delay ของ animation แสงกระเพื่อม เพื่อไม่ให้สว่างพร้อมกันหมด (ดูเป็นธรรมชาติ)
                textEl.style.animationDelay = `${Math.random() * 2}s`;
                textEl.classList.add('settled');
            }, 2250); 
        }

        // ปล่อยคำออกมาอย่างต่อเนื่องและรวดเร็วขึ้น
        for (let i = 0; i < maxWords; i++) {
            setTimeout(() => {
                spawnWord(i);
            }, i * 35); 
        }

        window.addEventListener('resize', () => {
            centerX = window.innerWidth / 2;
            centerY = window.innerHeight / 2;
            // ไม่แนะนำให้ล้างและวาดใหม่ทันทีตอนย่อจอ เพราะจะทำให้เสียเอฟเฟกต์บิน 
            // หากต้องการให้เป๊ะ แนะนำให้รีเฟรชหน้าเว็บเมื่อเปลี่ยนขนาดจอครับ
        });
    </script>
</body>
</html>
