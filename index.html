<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I Love You Heart</title>
    <style>
        body {
            background-color: #050505;
            margin: 0;
            overflow: hidden;
            height: 100vh;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #heart-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        .text-word {
            position: absolute;
            color: #ff3333;
            text-shadow: 0 0 3px #ff0000;
            opacity: 0;
            white-space: nowrap;
            font-weight: bold;
            transition: opacity 1s ease-in-out;
            pointer-events: none;
            transform: translateY(-50%);
        }
    </style>
</head>
<body>
    <div id="heart-container"></div>

    <script>
        const container = document.getElementById('heart-container');
        
        function drawHeart() {
            container.innerHTML = ''; 
            
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;
            
            const scale = 220; 
            const rowHeight = 20; 
            const paddingX = 6; 
            
            let delay = 0;
            const delayStep = 30; 

            const boxSize = 3 * scale;
            const startY = centerY - boxSize / 2;
            const endY = centerY + boxSize / 2;
            const startX = centerX - boxSize / 2;
            const endX = centerX + boxSize / 2;

            for (let sy = startY; sy < endY; sy += rowHeight) {
                let sx = startX;
                
                while (sx < endX) {
                    const mx = (sx - centerX) / scale;
                    const my = -(sy - centerY) / scale; 

                    if (Math.pow(mx * mx + my * my - 1, 3) - (mx * mx * Math.pow(my, 3)) <= 0) {
                        
                        // กำหนดให้ใช้แค่คำว่า "I love you" เท่านั้น
                        const phrase = "I love you";
                        
                        const el = document.createElement('div');
                        el.className = 'text-word';
                        el.innerText = phrase;
                        
                        const fontSize = 12 + Math.random() * 3;
                        el.style.fontSize = `${fontSize}px`;
                        
                        el.style.visibility = 'hidden';
                        document.body.appendChild(el);
                        const wordWidth = el.offsetWidth;
                        document.body.removeChild(el);
                        
                        el.style.visibility = 'visible';
                        el.style.left = `${sx}px`;
                        el.style.top = `${sy}px`;
                        
                        setTimeout(() => {
                            container.appendChild(el);
                            requestAnimationFrame(() => {
                                el.style.opacity = '1';
                            });
                        }, delay);
                        
                        delay += delayStep;
                        sx += wordWidth + paddingX;
                    } else {
                        sx += 5;
                    }
                }
            }
        }

        drawHeart();

        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(drawHeart, 200);
        });
    </script>
</body>
</html>
