<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfect Love Heart</title>
    <style>
        body {
            background-color: #050505;
            margin: 0;
            overflow: hidden;
            height: 100vh;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #heart-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        .text-word {
            position: absolute;
            color: #ff3333;
            text-shadow: 0 0 3px #ff0000;
            opacity: 0; /* เริ่มต้นด้วยการโปร่งใส */
            white-space: nowrap;
            font-weight: bold;
            transition: opacity 1s ease-in-out; /* แอนิเมชันตอนค่อยๆ สว่างขึ้น */
            pointer-events: none;
            transform: translateY(-50%); /* จัดให้อยู่กึ่งกลางบรรทัดพอดี */
        }
    </style>
</head>
<body>
    <div id="heart-container"></div>

    <script>
        const phrases = [
            "Ich liebe dich", "Ti amo", "愛してる", "Aku cinta kamu",
            "ฉันรักเธอ", "Te amo", "Je t'aime", "사랑해",
            "Jag älskar dig", "Я тебя люблю", "Σ' αγαπώ", "Anh yêu em",
            "Ik hou van jou", "I love you", "Seni seviyorum", "Kocham cię"
        ];

        const container = document.getElementById('heart-container');
        
        function drawHeart() {
            container.innerHTML = ''; // ล้างค่าเดิมเผื่อมีการรีเฟรช
            
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;
            
            const scale = 220; // ปรับขนาดของหัวใจตรงนี้
            const rowHeight = 20; // ระยะห่างระหว่างบรรทัด (แกน Y)
            const paddingX = 6; // ระยะห่างระหว่างคำ (แกน X)
            
            let delay = 0;
            const delayStep = 30; // ความเร็วในการปรากฏทีละคำ (มิลลิวินาที)

            // กำหนดขอบเขตการวาด (Bounding Box) ประมาณ -1.5 ถึง 1.5 ของสมการ
            const boxSize = 3 * scale;
            const startY = centerY - boxSize / 2;
            const endY = centerY + boxSize / 2;
            const startX = centerX - boxSize / 2;
            const endX = centerX + boxSize / 2;

            // สแกนพื้นที่จากบนลงล่าง (ทีละบรรทัด)
            for (let sy = startY; sy < endY; sy += rowHeight) {
                let sx = startX;
                
                // สแกนพื้นที่จากซ้ายไปขวา
                while (sx < endX) {
                    // แปลงพิกัดหน้าจอ (sx, sy) เป็นพิกัดสำหรับสมการคณิตศาสตร์ (mx, my)
                    const mx = (sx - centerX) / scale;
                    const my = -(sy - centerY) / scale; // ต้องติดลบเพราะแกน Y ของจอคอมพิวเตอร์กลับหัวกับกราฟคณิตศาสตร์

                    // เช็คว่าพิกัดนี้อยู่ในสมการรูปหัวใจหรือไม่: (x² + y² - 1)³ - x²y³ ≤ 0
                    if (Math.pow(mx * mx + my * my - 1, 3) - (mx * mx * Math.pow(my, 3)) <= 0) {
                        
                        // สุ่มคำ
                        const phrase = phrases[Math.floor(Math.random() * phrases.length)];
                        
                        // สร้าง Element เพื่อวัดความกว้างของคำก่อนนำไปวางจริง
                        const el = document.createElement('div');
                        el.className = 'text-word';
                        el.innerText = phrase;
                        
                        // สุ่มขนาดฟอนต์ให้ดูมีมิติเล็กน้อย (12px ถึง 15px)
                        const fontSize = 12 + Math.random() * 3;
                        el.style.fontSize = `${fontSize}px`;
                        
                        // ซ่อนไว้ก่อนเพื่อใช้วัดขนาด
                        el.style.visibility = 'hidden';
                        document.body.appendChild(el);
                        const wordWidth = el.offsetWidth;
                        document.body.removeChild(el);
                        
                        // กำหนดตำแหน่งที่แน่นอน
                        el.style.visibility = 'visible';
                        el.style.left = `${sx}px`;
                        el.style.top = `${sy}px`;
                        
                        // ใช้ setTimeout เพื่อสร้างเอฟเฟกต์ "ค่อยๆ เต็ม"
                        setTimeout(() => {
                            container.appendChild(el);
                            // ให้เบราว์เซอร์รับรู้การสร้าง element ก่อน ค่อยสั่งเปลี่ยน opacity เป็น 1 เพื่อให้ transition ทำงาน
                            requestAnimationFrame(() => {
                                el.style.opacity = '1';
                            });
                        }, delay);
                        
                        delay += delayStep;
                        
                        // ขยับจุดตรวจจับไปทางขวา เท่ากับความกว้างของคำที่เพิ่งวาง + ระยะห่าง 
                        // เพื่อให้คำต่อไปอยู่ต่อท้ายพอดี ไม่ทับกัน
                        sx += wordWidth + paddingX;
                    } else {
                        // ถ้าไม่อยู่ในรูปหัวใจ ให้ขยับจุดตรวจจับไปทางขวาทีละนิดเพื่อหาขอบหัวใจ
                        sx += 5;
                    }
                }
            }
        }

        // วาดหัวใจเมื่อเปิดหน้าเว็บ
        drawHeart();

        // ถ้าย่อ/ขยายหน้าจอ ให้วาดใหม่เพื่อให้อยู่ตรงกลางเสมอ
        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(drawHeart, 200);
        });
    </script>
</body>
</html>
