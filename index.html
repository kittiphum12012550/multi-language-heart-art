<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Heart Word Cloud</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #container {
            position: relative;
            width: 700px;
            height: 700px;
        }
        .love-word {
            position: absolute;
            color: #ff3333;
            font-family: 'Arial', sans-serif;
            font-size: 13px;
            white-space: nowrap;
            transform: translate(-50%, -50%);
            user-select: none;
        }
    </style>
</head>
<body>

<div id="container"></div>

<script>
    const loveWords = [
        "ฉันรักเธอ", "I love you", "Ich liebe dich", "Ti amo", "Je t'aime", 
        "Te amo", "愛してる", "사랑해", "Aku cinta kamu", "Seni seviyorum", 
        "Я тебя люблю", "Eu te amo", "Jag älskar dig", "Я тебе кохаю", "Σ' αγาπώ"
    ];

    const container = document.getElementById('container');
    const width = 700;
    const height = 700;

    // ฟังก์ชันคำนวณตำแหน่งรูปหัวใจ
    function getHeartPoint(t, scale = 14) {
        const x = 16 * Math.pow(Math.sin(t), 3);
        const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
        
        return {
            x: (width / 2) + x * scale,
            y: (height / 2) - y * scale
        };
    }

    // สร้างคำศัพท์และจัดเรียงเป็นรูปหัวใจ
    for (let i = 0; i < 350; i++) {
        const t = Math.random() * 2 * Math.PI;
        const spread = 0.8 + Math.random() * 0.25; // สุ่มให้คำกระจายตัวพอดีกับรูปทรง
        const point = getHeartPoint(t, 14 * spread);

        const span = document.createElement('span');
        span.className = 'love-word';
        span.innerText = loveWords[Math.floor(Math.random() * loveWords.length)];
        span.style.left = `${point.x}px`;
        span.style.top = `${point.y}px`;
        
        // สุ่มปรับความสว่างของสีแดงเล็กน้อยเพื่อเพิ่มมิติแบบในรูปภาพ
        const brightness = 150 + Math.floor(Math.random() * 105);
        span.style.color = `rgb(${brightness}, 40, 40)`;

        container.appendChild(span);
    }
</script>
</body>
</html>
